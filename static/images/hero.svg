<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Old-time banjo, minimal illustration">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A64B2A"/>
      <stop offset="1" stop-color="#7E3A20"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" fill="url(#clay)"/>
  <!-- faint concentric motif, left -->
  <g fill="none" stroke="#FAF7F1" stroke-opacity="0.08" stroke-width="2">
    <circle cx="150" cy="360" r="120"/>
    <circle cx="150" cy="360" r="190"/>
    <circle cx="150" cy="360" r="260"/>
  </g>
  <!-- minimal banjo line-art, right -->
  <g transform="translate(900,230)" fill="none" stroke="#FAF7F1" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round">
    <rect x="-22" y="-250" width="44" height="150" rx="12" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="128"/>
    <circle cx="0" cy="0" r="96" stroke-opacity="0.45"/>
    <line x1="-12" y1="-244" x2="-12" y2="118" stroke-opacity="0.6"/>
    <line x1="0" y1="-244" x2="0" y2="126" stroke-opacity="0.6"/>
    <line x1="12" y1="-244" x2="12" y2="118" stroke-opacity="0.6"/>
    <circle cx="-16" cy="-236" r="5" fill="#FAF7F1" stroke="none" fill-opacity="0.7"/>
    <circle cx="16" cy="-224" r="5" fill="#FAF7F1" stroke="none" fill-opacity="0.7"/>
  </g>
</svg>
