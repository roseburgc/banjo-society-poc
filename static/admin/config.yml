# ── Sveltia CMS configuration ───────────────────────────────────────────────
# Defines what a non-technical editor can change. Sveltia is Decap-compatible,
# so this same file works with Decap CMS if you ever switch.
#
# BEFORE GOING LIVE: set backend.repo to the institution's org/repo, e.g.
#   repo: old-time-banjo-society/website
# and connect a GitHub OAuth app (or use Sveltia's GitHub sign-in). See README.

backend:
  name: github
  repo: roseburgc/banjo-society-poc
  branch: main

# Where uploaded images land.
media_folder: "static/images"
public_folder: "/images"

# Nicer editing UX
editor:
  preview: false

collections:
  # Standalone pages (About, Get Involved, Contact) — one file each.
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home"
        file: "content/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Hero image", name: "hero_image", widget: "image", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "about"
        label: "About & History"
        file: "content/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Show on home", name: "featured", widget: "boolean", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "getinvolved"
        label: "Get Involved"
        file: "content/get-involved.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Show on home", name: "featured", widget: "boolean", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "contact"
        label: "Contact"
        file: "content/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Body", name: "body", widget: "markdown" }

  # Section landing pages (Method, Programs) — also single files here, but
  # modelled as a folder collection would let editors add sub-pages later.
  - name: "sections"
    label: "Sections"
    files:
      - name: "method"
        label: "Method"
        file: "content/method/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Show on home", name: "featured", widget: "boolean", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "programs"
        label: "Programs"
        file: "content/programs/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Show on home", name: "featured", widget: "boolean", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

  # Global site settings — editor-managed values lifted out of templates.
  # Demonstrates: footer/contact editing, and live theme color configuration.
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "global"
        label: "Global"
        file: "data/settings.yaml"
        fields:
          - { label: "Organization name", name: "org_name", widget: "string" }
          - label: "Footer / contact"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Mailing address", name: "address", widget: "string", required: false }
              - { label: "Monthly jam", name: "jam", widget: "string", required: false }
          - label: "Donate widget"
            name: "donate"
            widget: "object"
            fields:
              - { label: "Button label", name: "label", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Blurb", name: "blurb", widget: "text" }
          - label: "Theme colors"
            name: "theme"
            widget: "object"
            fields:
              - { label: "Accent (walnut)", name: "accent", widget: "color" }
              - { label: "Accent 2 (brass)", name: "accent2", widget: "color" }
              - { label: "Text (ink)", name: "ink", widget: "color" }
              - { label: "Background (paper)", name: "paper", widget: "color" }
