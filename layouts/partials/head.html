<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="preload" href="{{ "fonts/fraunces-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
{{/* Curated theme preset from Site Settings → CSS variables (guardrailed). */}}
{{ $key := "clay-cream" }}
{{ with hugo.Data.settings.theme }}{{ with .preset }}{{ $key = . }}{{ end }}{{ end }}
{{ with index hugo.Data.theme_presets $key }}
<style>:root{
  --ink: {{ .ink }};
  --paper: {{ .paper }};
  --accent: {{ .accent }};
  --accent-2: {{ .accent2 }};
}</style>
{{ end }}
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪕</text></svg>">
