<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ "/" | relURL }}">🪕 {{ .Site.Title }}</a>
    <nav class="site-nav">
      {{ $current := . }}
      {{ range .Site.Menus.main }}
        <a href="{{ .PageRef | relURL }}"{{ if $current.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
